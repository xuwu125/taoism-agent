[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/xuwu125/taoism-agent"
rust-version = "1.99"

[workspace.dependencies]
# 外部依赖：M0 刻意保持极小，只保留清单解析、摘要校验与原生 GUI。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
# T40 箓牒的文件级加密兜底：AEAD（ChaCha20-Poly1305）+ KDF（PBKDF2-HMAC-SHA256）。
# 手写密码学是错的，因此这里引入 RustCrypto 纯 Rust 实现（MIT / Apache-2.0，无 C 依赖）。
# 边界：只用于「系统凭据库不可用」时的加密落盘，不参与任何网络握手；详见 docs/03 第 6 节。
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "getrandom"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
zeroize = "1"

# TLS 白名单唯一例外（docs/02 第 8.5 / 39 节）：只服务 fulu-download（model seal/fetch）。
# 其余任何 crate 不得引入 TLS；provider/moli/MCP 的回环链路保持明文。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "0.26"

# 内部 crate：依赖方向严格单向，见 docs/02 第 5 节。
# 一律写成「path + version」：只写 path 会被 cargo-deny 判成 `*` 通配依赖（bans 规则 deny），
# 且 version 也让本地路径依赖在打包/发布时仍是合法版本要求。
fulu-core = { path = "crates/fulu-core", version = "0.1.0" }
fulu-script = { path = "crates/fulu-script", version = "0.1.0" }
fulu-register = { path = "crates/fulu-register", version = "0.1.0" }
fulu-provider = { path = "crates/fulu-provider", version = "0.1.0" }
fulu-model = { path = "crates/fulu-model", version = "0.1.0" }
fulu-download = { path = "crates/fulu-download", version = "0.1.0" }
fulu-engine = { path = "crates/fulu-engine", version = "0.1.0" }
fulu-runtime = { path = "crates/fulu-runtime", version = "0.1.0" }
fulu-orchestrator = { path = "crates/fulu-orchestrator", version = "0.1.0" }
fulu-tools = { path = "crates/fulu-tools", version = "0.1.0" }
fulu-skills = { path = "crates/fulu-skills", version = "0.1.0" }
fulu-audit = { path = "crates/fulu-audit", version = "0.1.0" }
fulu-app = { path = "crates/fulu-app", version = "0.1.0" }
# v0.3 能力面增量（M2.5 落地；M3.2 起会话头/提示词/符胆均已接入焚符循环）
fulu-mcp = { path = "crates/fulu-mcp", version = "0.1.0" }
fulu-context = { path = "crates/fulu-context", version = "0.1.0" }
fulu-prompt = { path = "crates/fulu-prompt", version = "0.1.0" }
fulu-vault = { path = "crates/fulu-vault", version = "0.1.0" }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
