name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 清单脚本会打印中文；Windows runner 的管道 stdout 默认不是 UTF-8，会 UnicodeEncodeError。
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  quality:
    name: fmt / clippy / test / manifest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-15, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # eframe/glow 在 Linux 上需要 X11/Wayland 客户端库用于链接期检查。
      - name: Install Linux GUI system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: Model manifest compliance
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" --version
          "$PY" .github/scripts/check_model_manifest.py

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: tests
        run: cargo test --workspace --locked

      - name: build binaries
        run: cargo build --locked --target ${{ matrix.target }} -p fulu-ui -p fulu-cli

  supply-chain:
    name: cargo-deny (licenses / advisories / sources)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
