name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 清单脚本会打印中文；Windows runner 的管道 stdout 默认不是 UTF-8，会 UnicodeEncodeError。
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  quality:
    name: fmt / clippy / test / manifest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-15, target: aarch64-apple-darwin }
          # T30：Intel macOS 仍在服役，不能只验 ARM。runner 用 macos-15-intel。
          - { os: macos-15-intel, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # eframe/glow 在 Linux 上需要 X11/Wayland 客户端库用于链接期检查。
      - name: Install Linux GUI system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: Python scripts (manifest + acceptance mock)
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" --version
          "$PY" .github/scripts/check_model_manifest.py
          # T24：合规声明生成器 —— 清单校验 + 单测全绿（--require-bundle 当前预期失败，不在 CI 断言）
          "$PY" .github/scripts/gen_compliance_notes.py --check
          "$PY" -m unittest discover -s .github/scripts/tests -v
          # 验收用的本地 mock 不是产品代码，但语法必须过——不能等到验收当天才发现跑不起来
          "$PY" -m py_compile tools/mock-llama.py

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # --no-fail-fast：一个 crate 失败不掩盖其它 crate 的失败（§41.5 间歇失败定位需要全量信息）。
      - name: tests
        run: cargo test --workspace --locked --no-fail-fast

      - name: build binaries
        run: cargo build --locked --target ${{ matrix.target }} -p fulu-ui -p fulu-cli

  supply-chain:
    name: cargo-deny (licenses / advisories / sources)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # T29：cargo-deny 的 advisories 与 RUSTSEC 官方 audit 口径不同，两者都留。
  # 只读依赖数据库，不产生任何构建产物。
  audit:
    name: cargo audit (RUSTSEC)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # T30：ARM64 Linux 只做 **编译验证**（fulu-cli，不含 GUI）。
  # GUI 交叉编译需要完整 arm64 X11 开发库与多架构环境，成本远高于收益，
  # 因此明确不覆盖——这一条写在 docs/03 第 1 节第 4 条里，不假装做了。
  cross-build:
    name: cross build (aarch64-unknown-linux-gnu, CLI only)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install cross linker
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu
      - name: Build CLI for ARM64 Linux
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --locked -p fulu-cli --target aarch64-unknown-linux-gnu
